# ==============================================
# Aura Website Nginx Configuration
# ==============================================
# Usage:
#   1. Copy this file to /etc/nginx/sites-available/aurawebsite
#   2. Replace YOUR_DOMAIN.com with your actual domain
#   3. Enable: sudo ln -s /etc/nginx/sites-available/aurawebsite /etc/nginx/sites-enabled/
#   4. Test:  sudo nginx -t
#   5. Reload: sudo systemctl reload nginx
# ==============================================

# Upstream - Next.js SSR server
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;
    return 301 https://$host$request_uri;
}

# HTTPS main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.com www.YOUR_DOMAIN.com;

    # ----- SSL Configuration -----
    # Replace with your actual certificate paths
    ssl_certificate     /etc/nginx/ssl/YOUR_DOMAIN.com.pem;
    ssl_certificate_key /etc/nginx/ssl/YOUR_DOMAIN.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ----- Security Headers -----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----- Gzip Compression -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ----- Next.js Static Assets (immutable cache) -----
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ----- Public Static Files -----
    location /public {
        alias /home/aurawebsite/public;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # ----- Favicon & robots -----
    location = /favicon.ico {
        proxy_pass http://nextjs_upstream;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /robots.txt {
        proxy_pass http://nextjs_upstream;
        access_log off;
    }

    # ----- Main Proxy to Next.js -----
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ----- Logs -----
    access_log /var/log/nginx/aurawebsite_access.log;
    error_log  /var/log/nginx/aurawebsite_error.log;
}
